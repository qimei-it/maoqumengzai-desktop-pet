name: Update manifest

# 发版后自动生成 dist/latest.json（应用内更新清单）并挂到 Release 上。
# 清单需要 macOS 与 Windows 两个安装包，所以在 Release 发布后从资产里下载，
# 而不是各自在 pack:mac / pack:win 里各写一份半成品。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例如 v1.0.3）'
        required: true

permissions:
  contents: write

concurrency:
  group: manifest-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        run: echo "TAG=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check package.json version matches tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "package.json 版本为 v$version，与 tag $TAG 不一致"
            exit 1
          fi

      - name: Download installers from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          for attempt in $(seq 1 10); do
            gh release download "$TAG" --pattern 'mqmz-*.dmg' --dir dist --clobber || true
            gh release download "$TAG" --pattern 'mqmz-*-setup.exe' --dir dist --clobber || true
            if ls dist/mqmz-*.dmg >/dev/null 2>&1 && ls dist/mqmz-*-setup.exe >/dev/null 2>&1; then
              break
            fi
            echo "第 $attempt 次：安装包还没齐，20 秒后重试"
            sleep 20
          done
          ls -l dist
          ls dist/mqmz-*.dmg >/dev/null 2>&1 || { echo "Release 缺少 .dmg"; exit 1; }
          ls dist/mqmz-*-setup.exe >/dev/null 2>&1 || { echo "Release 缺少 setup.exe"; exit 1; }

      - name: Generate latest.json
        run: node scripts/update-manifest.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: mqmz-latest-json
          path: dist/latest.json
          if-no-files-found: error
