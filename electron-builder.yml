appId: com.mqmz.desktop
productName: 毛趣萌仔
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - "!node_modules/@lucide/**"
  - "!node_modules/vue/**"
  - "!node_modules/@vue/**"
  - "!node_modules/@babel/**"
  - "!node_modules/magic-string/**"
  - "!node_modules/estree-walker/**"
  - "!node_modules/csstype/**"
asar: true
afterPack: scripts/after-pack.cjs
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/@napi-rs/**
  - node_modules/easyofd/**
  - node_modules/7zip-bin/**
  - node_modules/7zip-min/**
  - node_modules/pdfjs-dist/**
  - node_modules/node-unrar-js/**
  - node_modules/heic-decode/**
  - node_modules/libheif-js/**
extraResources:
  - from: resources/icons
    to: icons
    filter:
      - "**/*"
      - "!concepts/**"
  - from: resources/licenses
    to: licenses
  - from: THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
  - from: resources/skills
    to: skills
  - from: resources/engines/qpdf/LICENSE.txt
    to: engines/qpdf/LICENSE.txt
  - from: resources/engines/qpdf/SOURCE.txt
    to: engines/qpdf/SOURCE.txt
  - from: resources/engines/ffmpeg/SOURCE.txt
    to: engines/ffmpeg/SOURCE.txt
mac:
  icon: build/icon.icns
  artifactName: mqmz-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: 毛趣萌仔需要使用麦克风把语音转成文字。
  extraResources:
    - from: resources/helpers
      to: helpers
    - from: resources/engines/qpdf/darwin-arm64
      to: engines/qpdf/darwin-arm64
    - from: resources/engines/ffmpeg/darwin-arm64
      to: engines/ffmpeg/darwin-arm64
  target:
    - target: dmg
      arch: [arm64]
  minimumSystemVersion: '13.0'
# Stable mount point: the updater ejects /Volumes/<title> after an upgrade.
dmg:
  title: 毛趣萌仔
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
    - x: 130
      y: 310
      type: file
      path: resources/dmg/卸载说明.txt
    - x: 410
      y: 310
      type: file
      path: resources/dmg/卸载.command
win:
  icon: build/icon.ico
  artifactName: mqmz-${version}-setup.${ext}
  extraResources:
    - from: resources/engines/qpdf/win32-x64
      to: engines/qpdf/win32-x64
    - from: resources/engines/ffmpeg/win32-x64
      to: engines/ffmpeg/win32-x64
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
